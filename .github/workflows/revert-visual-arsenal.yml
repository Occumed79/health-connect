name: Revert Visualization Preload
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-visual-arsenal.yml
permissions:
  contents: write
env:
  INSTALL_COMMIT: "96d6c0c30ea2c2899a23a570a8503c132febee28"
jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revert account-wide visualization preload
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Occumed79/Network-Map/main/.github/scripts/revert-visual-arsenal.sh -o /tmp/revert-visual-arsenal.sh
          bash /tmp/revert-visual-arsenal.sh
